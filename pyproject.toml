[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "poster"
version = "0.1.0"
description = "CLI tool to automate eBay listings for vintage soccer jerseys"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[project.scripts]
poster = "poster.cli:main"
